# Sitio estático en Render. Las reglas rewrite reenvían /api y /uploads a la API desplegada.
services:
  - type: web
    name: gestor-tareas-spa
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    headers:
      - path: /sw.js
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /api/*
        destination: https://gestor-tareas-api-eq85.onrender.com/api/*
      - type: rewrite
        source: /uploads/*
        destination: https://gestor-tareas-api-eq85.onrender.com/uploads/*
      - type: rewrite
        source: /*
        destination: /index.html
